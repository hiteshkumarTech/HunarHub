name: CI

# Runs on every pull request and every push to main. No secrets are used —
# both jobs are fully self-contained (the backend's MongoDB is an in-memory
# instance started by the tests themselves, never a real database).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # mongodb-memory-server downloads a real mongod binary to ~/.cache/mongodb-binaries
      # on first use. Caching it across runs avoids re-downloading ~100MB+ every time;
      # the key is pinned to the exact MongoDB version below, so a version bump
      # naturally invalidates the cache instead of silently reusing a stale binary.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.2.6

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          # Pinned explicitly so CI doesn't silently follow whatever version
          # mongodb-memory-server defaults to after a future patch update.
          MONGOMS_VERSION: 8.2.6
